<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026" />
      <stop offset="50%" stop-color="#070728" />
      <stop offset="100%" stop-color="#040517" />
    </linearGradient>

    <!-- Cart Neon Gradient -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Lightning Glow Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e294b" stroke-width="2" />

  <!-- Speed / Laser Scan Lines -->
  <g opacity="0.45" stroke="#10b981" stroke-width="1.8" stroke-linecap="round">
    <line x1="16" y1="58" x2="32" y2="58" />
    <line x1="96" y1="58" x2="112" y2="58" />
    <line x1="20" y1="64" x2="28" y2="64" />
    <line x1="100" y1="64" x2="108" y2="64" />
  </g>

  <!-- Shopping Cart Frame -->
  <g filter="url(#neonGlow)">
    <!-- Cart Handle and Body -->
    <path d="M26 38 H34 L45 74 H88 L98 46 H40" 
          fill="none" 
          stroke="url(#cartGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Cart Bottom Rack -->
    <path d="M40 78 H85" 
          fill="none" 
          stroke="url(#cartGrad)" 
          stroke-width="4" 
          stroke-linecap="round" />

    <!-- Wheels -->
    <circle cx="50" cy="91" r="5" fill="#070728" stroke="url(#cartGrad)" stroke-width="4.5" />
    <circle cx="82" cy="91" r="5" fill="#070728" stroke="url(#cartGrad)" stroke-width="4.5" />
  </g>

  <!-- Central Electric Lightning Bolt (Luz) -->
  <g filter="url(#boltGlow)">
    <polygon points="68,20 48,54 62,54 53,86 78,48 64,48"
             fill="url(#boltGrad)" 
             stroke="#fef08a" 
             stroke-width="1.5" 
             stroke-linejoin="round" />
  </g>
</svg>
